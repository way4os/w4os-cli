# The name of the command line before w4os: an empty package that brings w4os-cli on an upgrade, dropped after one release.
name: opensim-cli
arch: all
platform: linux
version: ${VERSION}
version_schema: semver
section: oldlibs
priority: optional
maintainer: Gudule Lapointe <gudule@speculoos.world>
description: |-
    transitional package for w4os-cli
    The opensim command is in w4os-cli now. This empty package brings it on an
    upgrade; it can be removed.
homepage: https://github.com/way4os/w4os-cli
license: AGPL-3.0-or-later

depends:
    - w4os-cli (= ${DEB_VERSION})

contents:
    - src: packaging/w4os-cli.copyright
      dst: /usr/share/doc/opensim-cli/copyright
      file_info:
          mode: 0644
